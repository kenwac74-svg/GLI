name: GLI Web2 CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/web2-mvp

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run check
