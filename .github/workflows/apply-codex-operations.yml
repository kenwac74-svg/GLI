name: Apply Codex Operations Sync

on:
  push:
    branches: [codex/web2-mvp]
    paths:
      - ".github/codex-sync/**"
      - ".github/workflows/apply-codex-operations.yml"

permissions:
  contents: write

concurrency:
  group: codex-operations-sync
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated source and verify
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/codex-sync/ops-ready.txt ]; then
            echo "Waiting for payload marker."
            exit 0
          fi
          cat .github/codex-sync/ops-*.b64 > /tmp/gli-ops.tar.gz.b64
          base64 --decode /tmp/gli-ops.tar.gz.b64 > /tmp/gli-ops.tar.gz
          tar -xzf /tmp/gli-ops.tar.gz -C .
          npm ci
          npm run check
          rm -rf .github/codex-sync
          rm -f .github/workflows/apply-codex-operations.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add approval-gated operations workflow"
          git push origin HEAD:codex/web2-mvp
