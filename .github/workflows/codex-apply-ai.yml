name: Apply grounded AI advisor update
on:
  push:
    branches: [codex/web2-mvp]
    paths: [.github/workflows/codex-apply-ai.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/web2-mvp
      - name: Apply validated source
        env:
          PAYLOAD: 
        run: |
          printf "%s" "$PAYLOAD" | base64 -d > /tmp/codex-update.tar.gz
          tar -xzf /tmp/codex-update.tar.gz -C .
          rm .github/workflows/codex-apply-ai.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add grounded AI property advisor"
          git push origin HEAD:codex/web2-mvp