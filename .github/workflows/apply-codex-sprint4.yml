name: Apply Codex Sprint 4 Sync

on:
  push:
    branches:
      - codex/web2-mvp
    paths:
      - .github/codex-sync/archive-1-1.b64
      - .github/workflows/apply-codex-sprint4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/web2-mvp
      - name: Apply exact source files
        run: |
          cat .github/codex-sync/archive-1-1.b64 .github/codex-sync/archive-1-2.b64 .github/codex-sync/archive-1-3-1.b64 .github/codex-sync/archive-1-3-2-1.b64 .github/codex-sync/archive-1-3-2-2.b64 .github/codex-sync/archive-1-3-2-3.b64 .github/codex-sync/archive-1-3-2-4.b64 .github/codex-sync/archive-1-3-2-5.b64 .github/codex-sync/archive-2.b64 .github/codex-sync/archive-3.b64 | base64 -d > /tmp/gli-sprint4.tar.gz
          tar -tzf /tmp/gli-sprint4.tar.gz > /dev/null
          tar -xzf /tmp/gli-sprint4.tar.gz
          rm .github/codex-sync/archive-1.b64
          rm .github/codex-sync/archive-1-1.b64 .github/codex-sync/archive-1-2.b64 .github/codex-sync/archive-1-3-1.b64
          rm .github/codex-sync/archive-1-3-2-1.b64 .github/codex-sync/archive-1-3-2-2.b64 .github/codex-sync/archive-1-3-2-3.b64 .github/codex-sync/archive-1-3-2-4.b64 .github/codex-sync/archive-1-3-2-5.b64
          rm .github/codex-sync/archive-2.b64 .github/codex-sync/archive-3.b64 .github/codex-sync/sprint4-files.tar.gz
          rmdir .github/codex-sync
          rm .github/workflows/apply-codex-sprint4.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run check
      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: persist member workflows in D1"
          git push origin HEAD:codex/web2-mvp
